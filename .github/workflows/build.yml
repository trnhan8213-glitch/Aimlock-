# .github/workflows/build.yml
name: Build FreeFire Aimlock dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Create FreeFire Aimlock source
      run: |
        cat > aimlock.c << 'EOF'
        #define _GNU_SOURCE
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <dlfcn.h>
        #include <pthread.h>
        #include <unistd.h>
        #include <sys/uio.h>
        #include <mach/mach.h>
        #include <mach/vm_map.h>

        typedef struct {
            float x;
            float y;
            float z;
        } Vector3;

        typedef struct {
            Vector3 position;
            Vector3 head_position;
            float health;
            float distance;
            int is_visible;
            int team_id;
            int player_id;
        } PlayerEntity;

        typedef struct {
            Vector3 view_angles;
            Vector3 camera_position;
            float fov;
            int screen_width;
            int screen_height;
        } CameraState;

        static int aimlock_enabled = 1;
        static int triggerbot_enabled = 1;
        static float aim_fov = 15.0f;
        static float smooth_factor = 0.3f;
        static int target_priority = 0;
        static int aim_key = 0;
        static pthread_t aim_thread;
        static volatile int thread_running = 0;
        static mach_port_t task_port = MACH_PORT_NULL;

        static int (*original_strstr)(const char *, const char *) = NULL;
        static void *(*original_dlsym)(void *, const char *) = NULL;

        int hooked_strstr(const char *haystack, const char *needle) {
            const char *blocked[] = {"cheat", "hack", "mod", "inject", "bypass", "aimbot", "wallhack", NULL};
            for (int i = 0; blocked[i] != NULL; i++) {
                if (strstr(haystack, blocked[i]) != NULL) {
                    return 0;
                }
            }
            return original_strstr(haystack, needle);
        }

        void *hooked_dlsym(void *handle, const char *symbol) {
            if (strstr(symbol, "check") || strstr(symbol, "ban") || strstr(symbol, "detect")) {
                return NULL;
            }
            return original_dlsym(handle, symbol);
        }

        static Vector3 calculate_angle(Vector3 source, Vector3 target) {
            Vector3 delta;
            delta.x = target.x - source.x;
            delta.y = target.y - source.y;
            delta.z = target.z - source.z;
            float distance = sqrtf(delta.x*delta.x + delta.y*delta.y + delta.z*delta.z);
            Vector3 angle;
            angle.x = atan2f(delta.y, delta.x) * 180.0f / M_PI;
            angle.y = -asinf(delta.z / distance) * 180.0f / M_PI;
            angle.z = 0.0f;
            return angle;
        }

        static float calculate_distance(Vector3 a, Vector3 b) {
            float dx = a.x - b.x;
            float dy = a.y - b.y;
            float dz = a.z - b.z;
            return sqrtf(dx*dx + dy*dy + dz*dz);
        }

        static int is_within_fov(Vector3 current_angle, Vector3 target_angle, float fov) {
            float diff_x = fabsf(current_angle.x - target_angle.x);
            float diff_y = fabsf(current_angle.y - target_angle.y);
            return (diff_x <= fov && diff_y <= fov);
        }

        static Vector3 smooth_aim(Vector3 current, Vector3 target, float smooth) {
            Vector3 result;
            result.x = current.x + (target.x - current.x) * smooth;
            result.y = current.y + (target.y - current.y) * smooth;
            result.z = 0.0f;
            return result;
        }

        static void apply_anti_ban(void) {
            original_strstr = dlsym(RTLD_NEXT, "strstr");
            if (original_strstr) {
                void **ptr = dlsym(RTLD_DEFAULT, "strstr");
                if (ptr) *ptr = (void*)hooked_strstr;
            }
            original_dlsym = dlsym(RTLD_NEXT, "dlsym");
            if (original_dlsym) {
                void **ptr = dlsym(RTLD_DEFAULT, "dlsym");
                if (ptr) *ptr = (void*)hooked_dlsym;
            }
        }

        static void bypass_antiband(void) {
            float fake_accel[3] = {0.0f, 0.0f, 0.0f};
            int touch_speed = 0;
            float sensitivity = 100.0f;
            int aim_assist_bypass = 0xDEADBEEF;
        }

        __attribute__((constructor)) void init_aimlock() {
            task_port = mach_task_self();
            apply_anti_ban();
            bypass_antiband();
            printf("[Aimlock] Loaded successfully\n");
        }

        __attribute__((destructor)) void cleanup_aimlock() {
            thread_running = 0;
            if (aim_thread) pthread_join(aim_thread, NULL);
            printf("[Aimlock] Unloaded\n");
        }

        int enable_aimlock(void) {
            aimlock_enabled = 1;
            return 1;
        }

        int disable_aimlock(void) {
            aimlock_enabled = 0;
            return 0;
        }

        int set_fov(float fov) {
            if (fov < 1.0f) fov = 1.0f;
            if (fov > 90.0f) fov = 90.0f;
            aim_fov = fov;
            return 1;
        }

        int set_smooth(float smooth) {
            if (smooth < 0.01f) smooth = 0.01f;
            if (smooth > 1.0f) smooth = 1.0f;
            smooth_factor = smooth;
            return 1;
        }

        int set_priority(int priority) {
            target_priority = (priority >= 0 && priority <= 1) ? priority : 0;
            return 1;
        }

        int toggle_triggerbot(void) {
            triggerbot_enabled = !triggerbot_enabled;
            return triggerbot_enabled;
        }

        int get_status(void) {
            return aimlock_enabled ? 1 : 0;
        }
        EOF

    - name: Compile for iOS arm64
      run: |
        gcc -arch arm64 -shared -fPIC -o libaimlock.dylib aimlock.c \
          -Wall -Wextra -O2 -mios-version-min=13.0

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v3
      with:
        name: libaimlock
        path: libaimlock.dylib